schema_version = 1

[settings]
# Every backend exposes the same name. LiteLLM and clients never need to know
# which checkpoint is currently loaded.
served_model_name = "qwen-chat"
heavy_model_name = "heavy-model"
lite_model_name = "lite-model"
served_embedding_name = "qwen-embed"
vllm_port = 8002
heavy_port = 8002
lite_port = 8003
embedding_port = 8001
litellm_port = 4000
litellm_host = "0.0.0.0"
default_api_key = ""
startup_timeout_seconds = 1800
gpu_memory_budget = 0.95
heavy_gpu = "0"
lite_gpu = "1"
heavy_gpu_memory_utilization = 0.95
lite_gpu_memory_utilization = 0.90

# Each command is complete. The manager does not add model flags or inherit
# parser/context defaults from another profile. Only {model} and {api_key} are
# substituted at runtime.

