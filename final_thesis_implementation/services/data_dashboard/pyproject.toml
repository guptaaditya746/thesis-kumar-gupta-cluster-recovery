[project]
name = "thesis-data-dashboard"
version = "0.1.0"
description = "Read-only observability dashboard for processed thesis datasets and corpora."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1,<2",
  "humanize>=4.10,<5",
  "orjson>=3.10,<4",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "streamlit>=1.40,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
data-dashboard = "data_dashboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
