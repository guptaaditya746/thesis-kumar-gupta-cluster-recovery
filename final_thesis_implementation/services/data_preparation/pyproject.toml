[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thesis-data-prep"
version = "0.1.0"
description = "Isolated, reproducible data download and preprocessing service for DCI-style thesis experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thesis implementation" }]
dependencies = [
  "huggingface-hub>=0.28,<2",
  "pyarrow>=15,<24",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
]

[project.scripts]
data-prep = "thesis_data_prep.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_data_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
