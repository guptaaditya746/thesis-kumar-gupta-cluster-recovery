[project]
name = "query-driven-graphrag-service"
version = "0.1.0"
description = "Standalone, config-driven packaging of Query-Driven Multimodal GraphRAG"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "tomli>=2,<3; python_version < '3.11'",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "structlog>=24.1,<26",
  "word2number>=1.1,<2",
  "langtrace-python-sdk>=3.8.21",
]

[project.optional-dependencies]
multimodal = [
  "chromadb>=0.5,<1",
  "google-generativeai>=0.8,<1",
  "pillow>=10,<12",
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
]

dev = [
  "pytest>=8,<9",
]

[project.scripts]
query-driven = "query_driven.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_driven"]
