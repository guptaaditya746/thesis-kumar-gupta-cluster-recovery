# Query-Driven Multimodal GraphRAG — WebQA reproduction configuration.
#
# Keep this separate from BRIGHT. WebQA/MMQA have different dataset semantics
# and answer evaluation from BRIGHT retrieval.

[runtime]
operation = "pipeline"
output_root = "../../../../outputs/query_driven/webqa"
cache_root = "../../cache/webqa"
resume = true
overwrite = false
concurrency = 8
# max_questions = 20
max_refinement_iterations = 5
initial_entity_count = 2
table_entity_count = 1

[logging]
level = "INFO"
json = false
colors = true
# file = "../../cache/query_driven/service.log.jsonl"

[dataset]
format = "webqa"
questions = "../../../../data/processed/benchmarks/webqa/questions.json"
# If your prepared WebQA representation exposes text/image indices, set them here.
# texts = "../../../../data/processed/corpora/webqa/texts.jsonl"
# images = "../../../../data/processed/corpora/webqa/images.jsonl"
# image_root = "../../../../data/processed/corpora/webqa/images"

qid_field = "Guid"
question_field = "Q"
text_id_field = "id"
text_content_field = "text"
image_path_field = "path"
image_title_field = "title"

[text_model]
kind = "openai_compatible"
endpoint = "http://127.0.0.1:4000/v1/chat/completions"
model = "qwen-chat"
api_key_env = ""
temperature = 0.0
top_p = 1.0
max_tokens = 
timeout_seconds = 120

[embedding]
enabled = true
endpoint = "http://127.0.0.1:4000/v1/embeddings"
model = "qwen-embed"
cache_dir = "../../cache/webqa/embeddings"
timeout_seconds = 120

[vision]
enabled = false
endpoint = "http://127.0.0.1:11434/api/chat"
model = "llava:34b"
timeout_seconds = 120

[image_selector]
kind = "first"
model = "gemini-1.5-flash"
api_key_env = ""

[clip]
enabled = false
model = "CLIP-ViT-H-14-laion2B-s32B-b79K"
top_k = 3
device_map = "auto"

[evaluation]
enabled = true
kind = "webqa_answer"
# Use the WebQA-compatible evaluator implemented by the service.
