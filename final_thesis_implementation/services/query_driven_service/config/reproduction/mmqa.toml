# Query-Driven Multimodal GraphRAG — MultimodalQA reproduction configuration.
#
# This configuration is for reproducing the original MMQA-style pipeline.
# It is NOT the configuration to use for BRIGHT.
#
# Replace the dataset paths below with the exact filenames produced by your
# data_preparation service.

[runtime]
operation = "pipeline"
output_root = "../../../../outputs/query_driven/mmqa"
cache_root = "../../cache/mmqa"
resume = true
overwrite = false
concurrency = 8
# max_questions = 20
max_refinement_iterations = 5
initial_entity_count = 2
table_entity_count = 1

[logging]
level = "INFO"
json = false
colors = true
# file = "../../cache/query_driven/service.log.jsonl"

[dataset]
format = "mmqa"
questions = "../../../../data/processed/benchmarks/mmqa/questions.jsonl"
texts = "../../../../data/processed/corpora/mmqa/texts.jsonl"
tables = "../../../../data/processed/corpora/mmqa/tables.jsonl"
images = "../../../../data/processed/corpora/mmqa/images.jsonl"
image_root = "../../../../data/processed/corpora/mmqa/images"
image_description_dir = "../../../../data/processed/corpora/mmqa/image_descriptions"
# split = "dev"

qid_field = "qid"
question_field = "question"
text_id_field = "id"
text_content_field = "text"
image_path_field = "path"
image_title_field = "title"

[text_model]
kind = "openai_compatible"
endpoint = "http://127.0.0.1:4000/v1/chat/completions"
model = "qwen-chat"
api_key_env = ""
temperature = 0.0
top_p = 1.0
max_tokens = 
timeout_seconds = 120

[embedding]
enabled = true
endpoint = "http://127.0.0.1:4000/v1/embeddings"
model = "qwen-embed"
cache_dir = "../../cache/mmqa/embeddings"
timeout_seconds = 120

[vision]
# The original MMQA task is multimodal. Configure a compatible local vision
# endpoint/model before enabling this if you want full multimodal reproduction.
enabled = false
endpoint = "http://127.0.0.1:11434/api/chat"
model = "llava:34b"
timeout_seconds = 120

[image_selector]
# "first" avoids a Gemini dependency. Use "gemini" only when intentionally
# reproducing the original proxy-selection behavior.
kind = "first"
model = "gemini-1.5-flash"
api_key_env = ""

[clip]
# Enable only with the multimodal dependency set.
enabled = false
model = "CLIP-ViT-H-14-laion2B-s32B-b79K"
top_k = 3
device_map = "auto"

[evaluation]
enabled = true
kind = "mmqa_answer"
metrics = ["list_em", "list_f1"]
# prediction_file defaults to this run's predictions.json.
# gold_file defaults to dataset.questions.
